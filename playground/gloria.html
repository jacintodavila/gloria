%%
%% This editor holds a self-contained Gloria agent:
%%
%%   :- module(<agent>, ...).   the agent id (change it to rename the agent)
%%   abd/1, observable/1, ...   the agent configuration
%%   if_/2, def/2, ...          the knowledge base (goals and beliefs)

% Gloria agent enclosure (generated by playground/mkpage.py).
% Do not edit: regenerate from src/agents/enclosure/ instead.
:- module(enclosure, []).

%% %%%%%%%%%%%%%%%%%%%%%%%%%%%%%% enclosure.kb
if_((time_day(Time),it_is(Temp)),[adjust_home(Time,Temp)]).
def(adjust_home(am, sunny), (shut(east_window), open(doors))).
def(adjust_home(pm, sunny), (shut(west_window), open(doors))).
def(adjust_home(Anytime, rainy), (shut(east_window), shut(west_window), shut(doors))).

%% %%%%%%%%%%%%%%%%%%%%%%%%%%%%%% enclosure.main
tracefile('enclosure.dot' ) .
% see flach/graphviz .
for_testing_only(false ) .
abd(shut ) .
abd(open ) .
abd(time_day ) .
abd(it_is ) .
observable(time_day(_ ) ) .
observable(it_is(_ ) ) .
user_built(existe(_ ) ) .
` },
